# =============================================================================
# inventory.ini - Week 6 Weekly Task
# Points at the Docker container Terraform provisioned. Values match the
# defaults in variables.tf (ssh_port = 2222). Update if you changed them.
# =============================================================================

[app_servers]
app_server ansible_host=127.0.0.1 ansible_port=2222 ansible_user=root ansible_ssh_pass=devops123

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
